services:
  - type: web
    name: pagdandi
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: LLM_PROVIDER
        value: gemini-api
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMMA_MODEL
        sync: false
